<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Danh sách File - CyberStream</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body class="studio-page">

<nav class="navbar">
    <div class="nav-container">
        <a class="logo" href="/"><i class="fa-solid fa-play-circle"></i> CyberStream</a>
        <div class="nav-menu">
        </div>
    </div>
</nav>

<main class="main-content" style="margin-top: 100px;">
    <section class="content-section">
        <h2><i class="fa-solid fa-folder-open"></i> Danh sách File </h2>
        <div th:if="${#lists.isEmpty(filesInMediaDir)}">
            <p>Không có file nào trong thư mục này.</p>
        </div>
        <div class="media-grid" th:unless="${#lists.isEmpty(filesInMediaDir)}">
            <div class="media-card" th:each="fileName : ${filesInMediaDir}">
                <div class="thumbnail-placeholder">
                    <i class="fa-solid fa-file-video"></i>
                </div>
                <div class="card-details">
                    <h4 th:text="${fileName}">video_name.mp4</h4>
                    <div th:if="${isSecuritySecure}">
                        <a th:href="@{/api/media/stream/uploads(file=${fileName})}" class="play-link" target="_blank">
                            <i class="fa-solid fa-lock"></i> Xem
                        </a>
                    </div>
                    <div th:unless="${isSecuritySecure}">
                        <a th:href="@{/api/media/stream/uploads(file=${fileName})}" class="play-link" target="_blank">
                            <i class="fa-solid fa-unlock"></i> Xem
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </section>
</main>

<footer>
    <p>© 2026 TetraLine Entertainment Inc. </p>
</footer>

</body>
</html>
